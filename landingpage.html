<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Landing Page</title>
    <link rel="stylesheet" href="css/style-landingpage.css">
</head>
<body>

<header id="header">
    <img id="header-img" src="img/Kimchi-Kat.png" alt="Kimchi cat">
      
    <nav id="nav-bar">
        <a class="nav-link" href="#form-section">Form</a>
        <a class="nav-link" href="#video-section">Video</a>
        <a class="nav-link" href="#email">Email</a>
    </nav>
</header>

<main>
    <section id="video-section">
        <h2>Watch This Video</h2>
        <div class="video-wrapper">
        <iframe id="video" 
            src="https://www.youtube.com/embed/A7GGqzdJDBk" 
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
        </div>
    </section>

    <section id="form-section">
        <h2>Sign Up Here!</h2>
        <h4>For a chance to win a free jar of Kimchi</h4>
        <form id="form" action="https://www.freecodecamp.com/email-submit" method="post">
                <input id="email" placeholder="Enter Email Address" name="email" type="email" required>
                <input id="submit" type="submit" value="Submit">
        </form>
        </section>
</main>

<footer>
    <p>Footer Content</p>
</footer>

</body>
</html>
